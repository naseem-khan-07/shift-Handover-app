function login(){state.session=U(state.loginRole==='manager'?'m1':state.loginRole==='team_lead'?'tl1':state.loginWorker);state.worker=state.session.role==='worker'?state.session.id:'w1';state.view=state.session.role==='worker'?'my shift':'dashboard';state.handover=null;render()}

function loginPage(){const role=state.loginRole||'manager';const workers=users.filter(u=>u.role==='worker');return `<div class="login"><div class="loginart"><div class="loginbrand">✦ ShiftFlow</div><div class="logincopy"><span class="eyebrow">SHIFT INTELLIGENCE</span><h1>Every shift ends with clarity.</h1><p>Turn timestamped work activity into a traceable, deterministic handover for the next shift.</p><div class="proof">✓ Grounded in source records, not invented summaries.</div></div></div><div class="loginpanel"><div class="loginbox"><h2>Sign in to your workspace</h2><div class="muted">Use a seeded demo account.</div><div class="roles">${['manager','team_lead','worker'].map(r=>`<button class="${role===r?'sel':''}" onclick="state.loginRole='${r}';render()">${r==='team_lead'?'Team Lead':r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div>${role==='worker'?`<select onchange="state.loginWorker=this.value">${workers.map(w=>`<option value="${w.id}" ${w.id===(state.loginWorker||'w1')?'selected':''}>${w.name} — ${T(w.team_id).name}</option>`).join('')}</select>`:''}<button class="primary big" onclick="login()">Enter demo workspace →</button><div class="loginhint">Demo data only · no live Jira connection required</div></div></div></div>`}
function appShell(){const s=state.session;return `<div class="app"><aside class="side"><div class="brand"><div class="logo">✦</div>ShiftFlow</div><div class="ws">OPERATIONS CONTROL</div><div class="nav">${navs[s.role].map(v=>`<button class="${state.view===v?'active':''}" onclick="setState({view:'${v}'})">${icon(v)} ${label(v)}</button>`).join('')}</div><div class="userbox"><div class="ava">${initials(s.name)}</div><div><b>${s.name}</b><span>${label(s.role)}</span></div></div><button class="logout" onclick="state.session=null;render()">Sign out</button></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px;">${state.view!=='dashboard'?`<button class="secondary" style="padding:5px 12px;font-size:12px;border-radius:6px;font-weight:700;" onclick="setState({view:'dashboard'})">← Back to Dashboard</button>`:''}<div class="crumb"><span onclick="setState({view:'dashboard'})" style="cursor:pointer;">Operations</span> › <b>${state.view==='worker'?U(state.worker).name:label(state.view)}</b></div></div><div class="sync">● Live dynamic data</div></header><div class="content">${viewContent()}</div></main>${state.modal?modal():''}</div>`}
function icon(v){return ({dashboard:'⌂',teams:'◫','team leads':'◫',workers:'◌',handover:'▤',reports:'▥','my team':'◫','shift activity':'◷','my shift':'◷','my work':'✓','previous shift':'↪','next shift handover':'▤'})[v]||'•'}function label(v){return v.split(' ').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ')}
function title(h,p='',action=''){return `<div class="title"><div><span class="eyebrow">WORKSPACE</span><h1>${h}</h1><p>${p}</p></div>${action}</div>`}
function viewContent(){const v=state.view,s=state.session;if(v==='dashboard')return dashboard(s);if(v==='teams')return teamsPage();if(v==='team leads')return leadsPage();if(v==='workers'||v==='my team')return workersPage(s);if(v==='team')return teamPage(T(U(state.worker).team_id));if(['worker','my shift','my work','previous shift','shift activity'].includes(v))return workerPage();if(['handover','next shift handover'].includes(v))return handoverPage();if(v==='reports')return reportsPage();return ''}
function dashboard(s){if(s.role==='team_lead'){const t=T(s.team_id);return teamDashboard(t)}const cards=[['3','Teams'],['3','Team Leads'],['10','Workers'],['14','Active Tasks'],['21','Completed Today'],['6','Pending'],['2','Blockers']];return title('Manager dashboard','Operational overview from seeded shift activity')+`<div class="stats">${cards.map(x=>`<div class="stat"><span>${x[1]}</span><strong>${x[0]}</strong></div>`).join('')}</div><div class="sectionhead"><div><h2>Teams</h2><p>Click into the hierarchy to trace work down to a worker.</p></div><span class="source">Source: shift activity</span></div><div class="grid3">${teams.map(t=>teamCard(t)).join('')}</div><div class="callout">✦ <div><b>Deterministic handovers</b><span>Timestamp filter → dedupe by source + record ID → final state → four sections → priorities.</span></div></div>`}
function teamCard(t){return `<div class="team-card" onclick="state.worker='${t.worker_ids[0]}';state.view='team';render()"><div class="teamtop"><div class="teamicon">${t.name.slice(-1)}</div><span class="pill">Active</span></div><h3>${t.name}</h3><p>Team Lead: <b>${U(t.lead_id).name}</b></p><div class="metrics"><span>${t.worker_ids.length} workers</span><span>${t.id==='t1'?12:t.id==='t2'?9:5} active</span><span>${t.id==='t1'?3:t.id==='t2'?2:1} pending</span></div><div class="open">Open team →</div></div>`}
function teamDashboard(t){return title(`${t.name} dashboard`,`Team Lead: ${U(t.lead_id).name}`)+`<div class="stats" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><span>Workers</span><strong>${t.worker_ids.length}</strong></div><div class="stat"><span>Completed</span><strong>${t.id==='t1'?12:9}</strong></div><div class="stat"><span>In Progress</span><strong>4</strong></div><div class="stat"><span>Blockers</span><strong>${t.id==='t2'?0:1}</strong></div></div>${workersTable(t.worker_ids)}`}
function teamsPage(){return title('Teams','Manager view of all operational teams')+`<div class="grid3">${teams.map(teamCard).join('')}</div>`}
function leadsPage(){return title('Team Leads','Assigned lead-to-team relationships')+`<div class="people">${teams.map(t=>`<div class="person"><div class="ava large">${initials(U(t.lead_id).name)}</div><div><h3 style="margin:0">${U(t.lead_id).name}</h3><div class="muted">${t.name}</div><div class="mini">${t.worker_ids.map(id=>`<button onclick="state.worker='${id}';state.view='worker';render()">${U(id).name} →</button>`).join('')}</div></div></div>`).join('')}</div>`}
function workersPage(s){const ids=s.role==='team_lead'?T(s.team_id).worker_ids:users.filter(u=>u.role==='worker').map(u=>u.id);return title(s.role==='team_lead'?'My Team':'Workers','Browse worker profiles and shift traceability')+workersTable(ids)}
function workersTable(ids){return `<div class="tablecard"><table><thead><tr><th>Worker</th><th>Team</th><th>Team Lead</th><th>Current Task</th><th>Status</th></tr></thead><tbody>${ids.map(id=>{const u=U(id);return `<tr onclick="state.worker='${id}';state.view='worker';render()"><td><div class="usercell"><div class="ava">${initials(u.name)}</div><div><b>${u.name}</b><small>${u.title}</small></div></div></td><td>${T(u.team_id).name}</td><td>${U(u.team_lead_id).name}</td><td>${taskFor(id)}</td><td><span class="badge ${id==='w3'?'bad':id==='w2'?'good':'info'}">${id==='w3'?'Blocked':id==='w2'?'Completed':'In Progress'}</span></td></tr>`}).join('')}</tbody></table></div>`}
function taskFor(id){return ({w1:'Payment API',w2:'Login module',w3:'Database connection',w4:'Service validation',w5:'Kubernetes node alert',w6:'Mobile smoke tests',w7:'API refactor',w8:'Analytics query',w9:'Data validation',w10:'Checkout escalation'})[id]||'Operational task'}
function teamPage(t){return title(t.name,`Team Lead: ${U(t.lead_id).name} · ${t.worker_ids.length} workers`)+workersTable(t.worker_ids)}
function workerPage(){const u=U(state.worker),t=T(u.team_id),ev=events.filter(e=>e.worker_id===u.id&&new Date(e.timestamp)>=new Date(S)&&new Date(e.timestamp)<=new Date(E)).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));state.handover=generate(u.id);return title(u.name,'Worker profile · traceable shift activity',`<button class="primary" onclick="state.modal='summary';render()">✦ Generate handover</button>`)+`<div class="source" style="margin-bottom:12px;display:inline-block">Manager › ${t.name} › ${U(t.lead_id).name} › ${u.name}</div><div class="profile"><div class="ava xlarge">${initials(u.name)}</div><div><h2>${u.name}</h2><p>${u.title}</p><div class="relationship"><span>Team <b>${t.name}</b></span><span>Team Lead <b>${U(t.lead_id).name}</b></span><span>Current <b>09:00 AM – 05:00 PM</b></span><span>Previous <b>01:00 PM – 09:00 PM</b></span></div></div></div><div class="split"><div class="panel"><div class="panelhead"><div><h2>Current shift activity</h2><p>Only events inside 09:00 AM – 05:00 PM are eligible.</p></div><span class="source">${ev.length} source events</span></div>${timeline(ev)}</div><div class="panel"><div class="panelhead"><div><h2>Last completed shift</h2><p>01:00 PM – 09:00 PM · previous day</p></div></div>${previous(u.id)}</div></div>${handoverPreview(state.handover)}`}
function timeline(ev){if(!ev.length)return '<div class="empty">Nothing to report in this shift window.</div>';return ev.map(e=>`<div class="timeline-item"><div class="time">${fmt(e.timestamp)}</div><div class="tdot ${e.status}"></div><div class="eventbody"><div class="eventtop"><b>${e.record_id}</b><span class="badge ${cls(e.status)}">${e.status.replace('_',' ')}</span></div><p>${e.summary}</p><small>Source: ${e.source} / ${e.record_id}</small></div></div>`).join('')}
function previous(wid){const ev=events.filter(e=>e.worker_id===wid&&new Date(e.timestamp)>=new Date(PS)&&new Date(e.timestamp)<=new Date(PE));const m=new Map();ev.forEach(e=>m.set(e.source+'|'+e.record_id,e));const arr=[...m.values()].sort((a,b)=>a.timestamp.localeCompare(b.timestamp));return `<div class="prev">${arr.length?arr.map(e=>`<div class="previtem"><div class="sicon ${e.status}">${e.status==='completed'?'✓':e.status==='blocked'?'!':'•'}</div><div><b>${e.record_id} — ${e.summary}</b><span>${fmt(e.timestamp)} · ${e.source}</span></div></div>`).join(''):'<div class="empty">Nothing to report</div>'}</div>`}
function cls(s){return s==='completed'?'good':s==='blocked'||s==='escalated'?'bad':s==='watch'?'warn':'info'}
function handoverPreview(h){return `<div class="handover-preview"><div class="panelhead"><div><span class="eyebrow">NEXT SHIFT</span><h2>Handover ready</h2><p>${h.eventCount} in-window events · ${h.collapsed} duplicate updates collapsed</p></div><button class="primary" onclick="state.modal='summary';render()">Open quick summary →</button></div><div class="four">${summaryCard('Completed','✓',h.completed,'good')}${summaryCard('Still pending','•',h.inProgress,'info')}${summaryCard('Blockers / escalations','!',h.blockers,'bad')}${summaryCard('Watch-list','◉',h.watch,'warn')}</div><div class="priority"><div><b>Start with these</b><div class="muted">Derived from unresolved source records only.</div></div><div class="priorityrow">${h.priorities.slice(0,3).map((x,i)=>`<span><b>${i+1}</b> ${x.record_id} — ${x.summary}</span>`).join('')}</div><button class="secondary" onclick="state.modal='full';render()">View full handover</button></div></div>`}
function summaryCard(t,ic,items,cl){return `<div class="summary"><div class="summaryhead"><span class="badge ${cl}">${ic}</span><b>${t}</b><span>${items.length}</span></div>${items.slice(0,3).map(x=>`<div class="summaryitem"><b>${x.record_id}</b><span>${x.summary}</span></div>`).join('')||'<div class="empty" style="margin-top:8px">Nothing to report</div>'}</div>`}
function handoverPage(){if(!state.handover)state.handover=generate(state.worker);const h=state.handover;return title('Shift handover','Deterministic output from the selected shift window',`<button class="primary" onclick="state.handover=generate(state.worker);render()">↻ Regenerate</button>`)+`<div class="meta"><div><span>Worker</span><b>${h.worker.name}</b></div><div><span>Team</span><b>${h.team.name}</b></div><div><span>Team Lead</span><b>${h.lead.name}</b></div><div><span>Shift</span><b>09:00 AM – 05:00 PM</b></div><div><span>Events used</span><b>${h.eventCount}</b></div></div><div class="actions"><button class="primary" onclick="state.modal='summary';render()">Open simple summary</button><button class="secondary" onclick="state.modal='full';render()">View detailed handover</button><button class="secondary" onclick="downloadPdf()">Export handover PDF ↓</button></div>${detail(h)}`}
function detail(h){const sec=[['COMPLETED',h.completed,'good'],['IN PROGRESS',h.inProgress,'info'],['BLOCKERS / ESCALATIONS',h.blockers,'bad'],['WATCH-LIST',h.watch,'warn']];return `<div class="detail"><div class="detailtitle"><div><span class="eyebrow">SHIFT HANDOVER NOTE</span><h2>${h.worker.name} · ${h.team.name}</h2></div><span class="source">09:00 AM – 05:00 PM</span></div>${sec.map(([t,items,c])=>`<div class="dsection"><h3>${t} · ${items.length}</h3>${items.length?items.map(x=>`<div class="hline"><div class="lineicon ${c}">${c==='good'?'✓':c==='bad'?'!':c==='warn'?'◉':'•'}</div><div class="linemain"><b>${x.record_id} — ${x.summary}</b><div class="trace"><span>Source: <b>${x.source}</b></span><span>Record ID: <b>${x.record_id}</b></span><span>Timestamp: <b>${dt(x.timestamp)}</b></span><span>Final status: <b>${x.finalStatus}</b></span></div>${x.updates.length>1?`<small>Collapsed updates: ${x.updates.join(' → ')}</small>`:''}</div></div>`).join(''):'<div class="empty">Nothing to report</div>'}</div>`).join('')}<div class="dsection"><h3>NEXT-SHIFT PRIORITIES</h3>${h.priorities.length?h.priorities.map((x,i)=>`<div class="prioritydetail"><b>${i+1}</b><span><strong>${x.record_id}</strong> — ${x.summary}<small>Source: ${x.source} · ${dt(x.timestamp)}</small></span></div>`).join(''):'<div class="empty">Nothing to report</div>'}</div><div class="ground">✓ <div><b>Grounding check</b>Every item maps to a source + record ID + timestamp. No LLM is required.</div></div></div>`}
function reportsPage(){return title('Reports','Demo reporting surface')+`<div class="reports"><div class="report">▥<b> Handover coverage</b><strong>100%</strong><span>All seeded workers have a deterministic handover path.</span></div><div class="report">✓<b> Traceability</b><strong>100%</strong><span>Generated items carry source, record ID and timestamp.</span></div><div class="report">!<b> Duplicate control</b><strong>Active</strong><span>Updates collapse by source + record ID.</span></div></div>`}
function modal(){const h=state.handover;return `<div class="modalbg" onclick="if(event.target===this){state.modal=null;render()}"><div class="modal"><div class="modalhead"><div><span class="eyebrow">NEXT SHIFT HANDOVER</span><h2>${state.modal==='summary'?'Quick shift summary':'Detailed handover'}</h2><p>${h.worker.name} · ${h.team.name} · 09:00 AM – 05:00 PM</p></div><button class="close" onclick="state.modal=null;render()">×</button></div>${state.modal==='summary'?`<div class="steps">${[['01','Shift completed',h.completed],['02','Still pending',h.inProgress],['03','Blockers / escalations',h.blockers],['04','Start with these',h.priorities]].map((x,i)=>`<div class="step"><span>${x[0]}</span><h3>${x[1]}</h3><div class="lines">${x[2].length?x[2].slice(0,4).map(y=>`<div><b>${y.record_id}</b><span>${y.summary}</span></div>`).join(''):'<em>Nothing to report</em>'}</div><button class="continue">Continue →</button></div>`).join('')}</div>`:detail(h)}<div class="footer"><button class="secondary" onclick="state.modal=null;render()">Close</button><button class="primary" onclick="downloadPdf()">Export handover PDF ↓</button></div></div></div>`}
function pdfEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function downloadPdf(){try{const h=state.handover||generate(state.worker),lines=[];lines.push('SHIFT HANDOVER NOTE',`${h.worker.name} | ${h.team.name} | Team Lead: ${h.lead.name}`,'Shift: 09:00 AM - 05:00 PM (IST)','');[['COMPLETED',h.completed],['IN PROGRESS',h.inProgress],['BLOCKERS / ESCALATIONS',h.blockers],['WATCH-LIST',h.watch]].forEach(([title,items])=>{lines.push(title);if(!items.length)lines.push('Nothing to report');else items.forEach(x=>{lines.push(`${x.record_id} - ${x.summary}`,`Source: ${x.source} | Record ID: ${x.record_id} | Timestamp: ${dt(x.timestamp)} | Final: ${x.finalStatus}`);if(x.updates.length>1)lines.push(`Updates collapsed: ${x.updates.join(' -> ')}`)});lines.push('')});lines.push('NEXT-SHIFT PRIORITIES');h.priorities.forEach((x,i)=>lines.push(`${i+1}. ${x.record_id} - ${x.summary}`,`Source: ${x.source} | Timestamp: ${dt(x.timestamp)}`));const pages=[];let page=[];lines.forEach(l=>{if(page.length>=42){pages.push(page);page=[]}page.push(l)});if(page.length)pages.push(page);let objects=[],offsets=[];const add=o=>{offsets.push(objects.reduce((a,b)=>a+b.length,0));objects.push(o)};add('');let pageRefs=[];pages.forEach((pg,pi)=>{let content='BT\n/F1 10 Tf\n';let y=770;pg.forEach((l,i)=>{let size=i===0&&pi===0?16:(l&&['COMPLETED','IN PROGRESS','BLOCKERS / ESCALATIONS','WATCH-LIST','NEXT-SHIFT PRIORITIES'].includes(l)?12:9);content+=`/F1 ${size} Tf\n1 0 0 1 45 ${y} Tm (${pdfEscape(l.slice(0,115))}) Tj\n`;y-=17});content+='ET';const ci=objects.length;add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);const piObj=objects.length;add(`<< /Type /Page /Parent PAGES /MediaBox [0 0 612 792] /Resources << /Font << /F1 FONT >> >> /Contents ${ci+1} 0 R >>`);pageRefs.push(piObj+1)});const fontIdx=objects.length;add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');const pagesIdx=objects.length;add(`<< /Type /Pages /Kids [${pageRefs.map(n=>n+' 0 R').join(' ')}] /Count ${pageRefs.length} >>`);objects[0]='<< /Type /Catalog /Pages '+(pagesIdx+1)+' 0 R >>';let pdf='%PDF-1.4\n',offs=[0];objects.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o.replace('PAGES',(pagesIdx+1)+' 0 R').replace('FONT',(fontIdx+1)+' 0 R')}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offs.length;i++)pdf+=String(offs[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;const blob=new Blob([pdf],{type:'application/pdf'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`shift-handover-${h.worker.name.replace(/\s+/g,'-').toLowerCase()}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert('PDF generation failed. The detailed handover remains available on screen.')}}
render();
</script></body></html>
